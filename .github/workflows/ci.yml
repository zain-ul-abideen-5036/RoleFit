name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: formatting, lint and types. Runs first and on its own so a
  # missing semicolon does not wait behind a database container.
  # ---------------------------------------------------------------------------
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Unit tests. No database, no network, no AI provider.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Integration tests against a real PostgreSQL. The point of these is the
  # actual SQL, constraints and cascade behaviour, so a fake would defeat them.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rolefit
          POSTGRES_PASSWORD: rolefit
          POSTGRES_DB: rolefit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolefit -d rolefit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rolefit:rolefit@localhost:5432/rolefit_test
      AUTH_SECRET: ci-integration-secret-value-long-enough-to-validate-0123456789
      AI_PROVIDER: deterministic
      STORAGE_DRIVER: local

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Production build. Catches anything that only fails when compiled: route
  # type generation, server/client boundary violations, missing env contracts.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://rolefit:rolefit@localhost:5432/rolefit
      AUTH_SECRET: ci-build-secret-value-long-enough-to-validate-01234567890
      NEXT_PUBLIC_APP_URL: https://example.com

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # End-to-end against a production build, including the cross-account
  # authorization checks. This is the gate that matters most before a deploy.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only worth the runner time once the cheaper gates are green.
    needs: [static, unit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rolefit
          POSTGRES_PASSWORD: rolefit
          POSTGRES_DB: rolefit_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolefit -d rolefit_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://rolefit:rolefit@localhost:5432/rolefit_e2e
      DATABASE_URL: postgresql://rolefit:rolefit@localhost:5432/rolefit_e2e
      AUTH_SECRET: ci-e2e-secret-value-that-is-long-enough-to-validate-0123456789
      AI_PROVIDER: deterministic
      STORAGE_DRIVER: local
      NEXT_PUBLIC_APP_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # A single required status check, so branch protection needs one entry rather
  # than being updated every time a job is added.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [static, unit, integration, build, e2e]

    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
