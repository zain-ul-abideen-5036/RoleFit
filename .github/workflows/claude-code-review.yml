# Automated review on every pull request.
#
# This is the self-hosted route: the managed Code Review product is Team and
# Enterprise only, so the review runs here, in this repository's own Actions
# minutes, against the same plugin the managed product uses.
#
# It needs one secret, which is not in this file and must never be:
#
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token`, billed to the Claude
#                              subscription rather than per-token. Preferred.
#   ANTHROPIC_API_KEY        — a Claude Console key, billed per token. Swap the
#                              `claude_code_oauth_token` line below for
#                              `anthropic_api_key` if you use this instead.
#
# Until that secret exists the job fails on every pull request. That is loud
# rather than silent, which is the right way round for a check that is supposed
# to be running.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    # Read-only over the repository. The review posts through the Claude GitHub
    # App's own installation token, not through these, so it needs no write
    # access to anything here.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required for the action's default GitHub App authentication.
      id-token: write

    # A review is not free — it is billed per run — so one run per ref at a
    # time, and a superseded push cancels the run it superseded.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # A review that has not finished in half an hour is not going to.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is what puts the findings on the pull request. Without
          # it they go only to the workflow log, where nobody reads them.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Required even though the skill's own frontmatter names the same
          # tool: the action starts the inline-comment MCP server only when
          # --allowedTools here asks for it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
